<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #EBE5DA;
    --board: #F7F3EC;
    --ink: #2C2826;
    --ink-light: #8A8478;
    --red: #A09888;
    --blue: #7A8A98;
    --green: #7A8A7A;
    --yellow: #7A6B4E;
    --orange: #907A60;
    --shu: #C03C28;
    --marker-bg: rgba(44, 40, 38, 0.04);
    --hand: 'Kalam', 'PingFang SC', cursive;
    --marker: 'Permanent Marker', 'PingFang SC', cursive;
    --sans: 'DM Sans', 'PingFang SC', system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .board-frame {
    width: 1080px;
    padding: 1px;
    background: rgba(180,170,155,0.15);
    border-radius: 2px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.25);
    position: relative;
  }

  .board {
    width: 100%;
    background: var(--board);
    position: relative;
    overflow: hidden;
  }

  .board > .surface {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(200,180,150,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 55%, rgba(180,160,130,0.04) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  .colophon {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 56px 28px;
    border-top: 1px solid rgba(212,196,176,0.04);
  }

  .colophon .who {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .colophon .who img {
    width: 40px; height: 40px;
    border-radius: 50%; object-fit: cover;
  }

  .colophon .who span {
    font: 400 24px/1 var(--sans);
    color: var(--ink-light);
  }

  .colophon .info-source {
    font: 400 22px/1 var(--mono);
    color: var(--ink-light);
  }

  /* ===== 技术 tone overrides ===== */
  :root {
    --board: #F3F4F7;
    --yellow: #5A6878;
  }
  .board {
    background: var(--board);
  }
  .board > .surface {
    background:
      radial-gradient(ellipse at 30% 15%, rgba(140,155,175,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(120,140,165,0.05) 0%, transparent 45%);
  }

  /* ===== Content area ===== */
  .content {
    position: relative;
    z-index: 1;
    padding: 52px 56px 36px;
  }

  /* Board title */
  .board-title {
    font: 700 42px/1.3 var(--hand);
    color: var(--ink);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .board-subtitle {
    font: 400 26px/1.5 var(--hand);
    color: var(--ink-light);
    margin-bottom: 40px;
  }

  /* Yellow-highlighted keyword */
  .hl {
    background: var(--yellow);
    color: #fff;
    padding: 2px 10px;
    border-radius: 3px;
    font-weight: 700;
  }

  /* Chalk circle around keyword */
  .chalk-circle {
    position: relative;
    display: inline-block;
    padding: 0 6px;
  }
  .chalk-circle::after {
    content: '';
    position: absolute;
    inset: -6px -10px;
    border: 2.5px solid var(--ink-light);
    border-radius: 50%;
    opacity: 0.55;
    transform: rotate(-3deg);
  }

  /* Chalk box for conclusion */
  .chalk-box {
    position: relative;
    display: inline-block;
    border: 2.5px solid var(--shu);
    border-radius: 6px;
    padding: 14px 22px;
    margin-top: 32px;
    opacity: 0.9;
    transform: rotate(-0.5deg);
  }
  .chalk-box::before {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1.5px solid var(--shu);
    border-radius: 8px;
    opacity: 0.2;
    transform: rotate(0.8deg);
  }

  /* 朱砂 red text */
  .shu { color: var(--shu); font-weight: 700; }

  /* ===== Logic chain ===== */
  .logic-chain {
    display: flex;
    align-items: flex-start;
    gap: 0;
    margin: 36px 0 28px;
    flex-wrap: nowrap;
  }

  .chain-node {
    flex: 0 0 auto;
    text-align: center;
    padding: 18px 20px;
    position: relative;
  }

  .chain-node .step-num {
    font: 700 18px/1 var(--sans);
    color: var(--ink-light);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .chain-node .step-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chain-node .step-icon svg {
    width: 40px;
    height: 40px;
  }

  .chain-node .step-label {
    font: 700 28px/1.3 var(--hand);
    color: var(--ink);
  }

  .chain-node .step-detail {
    font: 400 20px/1.4 var(--hand);
    color: var(--ink-light);
    margin-top: 4px;
  }

  .chain-arrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 42px;
    color: var(--ink-light);
    font-size: 36px;
    opacity: 0.6;
    letter-spacing: -2px;
  }

  /* ===== Fact grid ===== */
  .fact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 40px;
    margin: 24px 0 0;
  }

  .fact-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }

  .fact-item .bullet {
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-light);
    margin-top: 10px;
    opacity: 0.5;
  }

  .fact-item .fact-text {
    font: 400 24px/1.5 var(--hand);
    color: var(--ink);
  }

  .fact-item .fact-text strong {
    font-weight: 700;
  }

  /* Washi paper texture overlay */
  .washi {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }

  /* Divider line */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ink-light), transparent);
    opacity: 0.15;
    margin: 28px 0;
  }

  /* URL styling */
  .url-text {
    font: 400 22px/1.5 var(--mono);
    color: var(--blue);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="arrow-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--red)" />
    </marker>
    <marker id="arrow-b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--blue)" />
    </marker>
    <marker id="arrow-w" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--ink)" />
    </marker>
    <marker id="arrow-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--green)" />
    </marker>
    <marker id="arrow-y" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--yellow)" />
    </marker>
    <marker id="arrow-s" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--shu)" />
    </marker>
  </defs>
</svg>
<div class="board-frame">
<div class="board">
  <div class="surface"></div>
  <div class="content">
    <div class="washi"></div>

    <!-- Title -->
    <div class="board-title">小米 <span class="hl">MiMo V2.5</span> 开放平台公测</div>
    <div class="board-subtitle">
      全系小米AI大模型开放 · <span class="chalk-circle">100万亿Token</span> 免费申领
    </div>

    <!-- Logic chain -->
    <div class="logic-chain">
      <div class="chain-node">
        <div class="step-num">Step 1</div>
        <div class="step-icon">
          <svg viewBox="0 0 40 40" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round">
            <rect x="6" y="4" width="28" height="32" rx="3"/>
            <line x1="13" y1="12" x2="27" y2="12"/>
            <line x1="13" y1="18" x2="27" y2="18"/>
            <line x1="13" y1="24" x2="22" y2="24"/>
            <circle cx="28" cy="30" r="6" fill="var(--yellow)" stroke="none" opacity="0.2"/>
            <path d="M26 30 l2 2 4-4" stroke="var(--ink)" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="step-label">注册</div>
        <div class="step-detail">platform.xiaomimimo.com</div>
      </div>

      <div class="chain-arrow">&rarr;</div>

      <div class="chain-node">
        <div class="step-num">Step 2</div>
        <div class="step-icon">
          <svg viewBox="0 0 40 40" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round">
            <rect x="4" y="12" width="32" height="16" rx="3"/>
            <text x="20" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" stroke="none" font-family="monospace">V4B9NJ</text>
          </svg>
        </div>
        <div class="step-label">填邀请码</div>
        <div class="step-detail"><span class="shu">V4B9NJ</span> 即到账</div>
      </div>

      <div class="chain-arrow">&rarr;</div>

      <div class="chain-node">
        <div class="step-num">Step 3</div>
        <div class="step-icon">
          <svg viewBox="0 0 40 40" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round">
            <rect x="6" y="8" width="28" height="24" rx="3"/>
            <line x1="6" y1="16" x2="34" y2="16"/>
            <text x="20" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--shu)" stroke="none" font-family="sans-serif">¥10</text>
          </svg>
        </div>
        <div class="step-label">领体验金</div>
        <div class="step-detail"><span class="shu">¥10</span> API 体验金</div>
      </div>

      <div class="chain-arrow">&rarr;</div>

      <div class="chain-node">
        <div class="step-num">Step 4</div>
        <div class="step-icon">
          <svg viewBox="0 0 40 40" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round">
            <circle cx="20" cy="16" r="10"/>
            <path d="M15 14 C15 10, 25 10, 25 14" />
            <line x1="20" y1="26" x2="20" y2="34"/>
            <line x1="14" y1="32" x2="26" y2="32"/>
            <!-- lightbulb rays -->
            <line x1="20" y1="2" x2="20" y2="5" opacity="0.4"/>
            <line x1="9" y1="6" x2="11" y2="8" opacity="0.4"/>
            <line x1="31" y1="6" x2="29" y2="8" opacity="0.4"/>
          </svg>
        </div>
        <div class="step-label">使用模型</div>
        <div class="step-detail">MiMo-V2.5 全系</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Facts grid -->
    <div class="fact-grid">
      <div class="fact-item">
        <div class="bullet"></div>
        <div class="fact-text"><span class="chalk-circle">100 万亿 Token</span> 免费申领</div>
      </div>
      <div class="fact-item">
        <div class="bullet"></div>
        <div class="fact-text">有效期 <strong>40 天</strong></div>
      </div>
      <div class="fact-item">
        <div class="bullet"></div>
        <div class="fact-text">邀请名额仅 <span class="shu">20 位</span>，先到先得</div>
      </div>
      <div class="fact-item">
        <div class="bullet"></div>
        <div class="fact-text"><span class="url-text">platform.xiaomimimo.com</span></div>
      </div>
    </div>

    <!-- Conclusion chalk box -->
    <div class="chalk-box">
      <svg style="display:inline-block;vertical-align:middle;margin-right:8px;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--shu)" stroke-width="2" stroke-linecap="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
      <span style="font:700 26px/1.4 var(--hand);color:var(--ink);">
        邀请码 <span class="shu">V4B9NJ</span> &mdash; 填码即到账，限时 20 个名额
      </span>
    </div>

  </div>

  <div class="colophon">
    <div class="who">
      <img src="logo.png" alt="">
      <span>大强同学「www.dqtx.cc」</span>
    </div>
  </div>
</div>
</div>
</body>
</html>
