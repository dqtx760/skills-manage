<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Architects+Daughter&family=Patrick+Hand&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #FAFAF5;
    --ink: #2B2B2B;
    --ink-light: #6B6B6B;
    --accent: #2D6A4F;
    --marker: #D4EDDA;
    --block: #E8F4EC;
    --hand: 'Caveat', 'PingFang SC', cursive;
    --hand-alt: 'Architects Daughter', 'Patrick Hand', cursive;
    --sans: 'DM Sans', 'PingFang SC', system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .page {
    width: 1080px;
    background: var(--bg);
    position: relative;
    padding: 40px 60px 20px;
  }

  .page > .grain {
    position: absolute;
    inset: 0;
    filter: url(#noise);
    opacity: 0.03;
    pointer-events: none;
    z-index: 100;
  }

  .page > .dotgrid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .colophon {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 60px 36px;
    border-top: 2px dashed rgba(0,0,0,0.08);
  }

  .colophon .who {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .colophon .who img {
    width: 40px; height: 40px;
    border-radius: 50%; object-fit: cover;
  }

  .colophon .who span {
    font: 400 24px/1 var(--sans);
    color: var(--ink-light);
  }

  .colophon .info-source {
    font: 400 22px/1 var(--mono);
    color: var(--ink-light);
  }

  /* ============ CUSTOM CSS ============ */

  .sketch-container {
    position: relative;
    z-index: 1;
  }

  /* Title */
  .title-area {
    text-align: center;
    margin-bottom: 6px;
    padding: 10px 0 16px;
  }

  .title-main {
    font: 700 60px/1.15 var(--hand);
    color: var(--accent);
    display: inline-block;
    transform: rotate(-1.5deg);
    position: relative;
  }

  .title-main .highlight-bg {
    position: absolute;
    left: -12px; right: -12px;
    top: 8px; bottom: 4px;
    background: var(--marker);
    border-radius: 4px;
    z-index: -1;
    transform: rotate(0.5deg);
  }

  .title-sub {
    font: 500 28px/1.3 var(--hand);
    color: var(--ink-light);
    margin-top: 6px;
    transform: rotate(0.8deg);
  }

  /* Divider line */
  .wavy-divider {
    width: 75%;
    margin: 0 auto 18px;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0, var(--accent) 8px, transparent 8px, transparent 14px);
    opacity: 0.4;
    transform: rotate(-0.3deg);
  }

  /* Two-column layout: left = concept map, right = sticky note */
  .main-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    padding: 0 10px;
  }

  .left-col {
    flex: 1;
  }

  .right-col {
    width: 260px;
    flex-shrink: 0;
  }

  /* Concept map */
  .concept-map {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    position: relative;
    padding: 10px 0;
  }

  /* Concept node */
  .concept-node {
    background: white;
    border: 2.5px solid var(--accent);
    border-radius: 14px;
    padding: 16px 20px 14px;
    text-align: center;
    position: relative;
    box-shadow: 3px 4px 0 rgba(45,106,79,0.12);
    width: 175px;
  }

  .concept-node:nth-child(1) { transform: rotate(-1deg); }
  .concept-node:nth-child(2) { transform: rotate(0.8deg); margin-top: 24px; }
  .concept-node:nth-child(3) { transform: rotate(-0.5deg); }
  .concept-node:nth-child(4) { transform: rotate(1.2deg); margin-top: 16px; }

  .node-icon {
    display: block;
    margin: 0 auto 4px;
  }

  .node-label {
    font: 600 22px/1.2 var(--hand);
    color: var(--accent);
    margin-bottom: 4px;
  }

  .node-value {
    font: 700 36px/1.1 var(--hand);
    color: var(--ink);
  }

  .node-desc {
    font: 400 18px/1.3 var(--hand);
    color: var(--ink-light);
    margin-top: 4px;
  }

  /* SVG arrows between concept nodes */
  .arrows-row {
    position: relative;
    height: 40px;
    margin-top: -8px;
  }

  /* Sticky note for invitation code */
  .sticky-note {
    position: relative;
    background: #FFF9C4;
    padding: 22px 20px 18px;
    width: 250px;
    box-shadow: 4px 5px 14px rgba(0,0,0,0.12);
    transform: rotate(2.8deg);
  }

  .sticky-note::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 16px;
    background: rgba(0,0,0,0.07);
    border-radius: 0 0 4px 4px;
  }

  .sticky-label {
    font: 500 20px/1 var(--hand);
    color: var(--ink-light);
    margin-bottom: 10px;
    text-align: center;
  }

  .sticky-code {
    font: 700 46px/1.2 var(--hand);
    color: #C62828;
    letter-spacing: 3px;
    text-align: center;
    display: block;
  }

  .sticky-hint {
    font: 400 17px/1.3 var(--hand);
    color: var(--ink-light);
    margin-top: 10px;
    text-align: center;
  }

  .sticky-arrow {
    text-align: center;
    margin-top: 10px;
  }

  /* Benefits row */
  .benefits-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin-top: 22px;
  }

  .benefit-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--marker);
    border: 2px solid var(--accent);
    border-radius: 40px;
    padding: 10px 22px;
  }

  .benefit-pill:nth-child(1) { transform: rotate(-0.8deg); }
  .benefit-pill:nth-child(2) { transform: rotate(0.5deg); }
  .benefit-pill:nth-child(3) { transform: rotate(-0.4deg); }

  .benefit-text {
    font: 600 22px/1.2 var(--hand);
    color: var(--accent);
  }

  .benefit-text strong {
    font-size: 28px;
    color: var(--ink);
  }

  /* CTA area */
  .cta-area {
    text-align: center;
    margin-top: 18px;
    padding: 12px 0;
  }

  .cta-url {
    font: 600 26px/1.4 var(--mono);
    color: var(--accent);
    background: var(--marker);
    display: inline-block;
    padding: 8px 28px;
    border-radius: 8px;
    border: 2px dashed var(--accent);
    transform: rotate(-0.5deg);
  }

  .cta-note {
    font: 500 20px/1.3 var(--hand);
    color: var(--ink-light);
    margin-top: 8px;
    transform: rotate(0.5deg);
  }

  /* Marker highlight text */
  .marker-text {
    background: var(--marker);
    padding: 1px 6px;
    border-radius: 3px;
  }

  .red-accent { color: #C62828; }

  /* ============ END CUSTOM CSS ============ */
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2D6A4F" />
    </marker>
    <!-- SVG icon defs -->
    <symbol id="icon-key" viewBox="0 0 48 48">
      <circle cx="16" cy="18" r="10" fill="none" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="24" y1="24" x2="44" y2="44" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="38" y1="38" x2="42" y2="34" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="34" y1="34" x2="38" y2="30" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-coin" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="16" fill="none" stroke="#2D6A4F" stroke-width="2.8"/>
      <text x="24" y="30" text-anchor="middle" font-family="Caveat,cursive" font-size="22" font-weight="700" fill="#2D6A4F">Y</text>
    </symbol>
    <symbol id="icon-token" viewBox="0 0 48 48">
      <rect x="6" y="12" width="36" height="24" rx="4" fill="none" stroke="#2D6A4F" stroke-width="2.8"/>
      <line x1="6" y1="20" x2="42" y2="20" stroke="#2D6A4F" stroke-width="2"/>
      <circle cx="16" cy="30" r="4" fill="none" stroke="#2D6A4F" stroke-width="2"/>
      <circle cx="28" cy="30" r="4" fill="none" stroke="#2D6A4F" stroke-width="2"/>
    </symbol>
    <symbol id="icon-brain" viewBox="0 0 48 48">
      <path d="M24 42 C24 42 10 34 10 22 C10 14 16 8 24 8 C32 8 38 14 38 22 C38 34 24 42 24 42Z" fill="none" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M24 12 C24 12 20 18 20 24 C20 30 24 38 24 38" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 18 C18 20 20 22 20 26" fill="none" stroke="#2D6A4F" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M32 18 C30 20 28 22 28 26" fill="none" stroke="#2D6A4F" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 48 48">
      <circle cx="18" cy="16" r="7" fill="none" stroke="#2D6A4F" stroke-width="2.5"/>
      <path d="M6 38 C6 30 12 26 18 26 C24 26 30 30 30 38" fill="none" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="34" cy="18" r="5" fill="none" stroke="#2D6A4F" stroke-width="2"/>
      <path d="M28 36 C28 30 32 28 34 28 C38 28 42 30 42 36" fill="none" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-zap" viewBox="0 0 48 48">
      <polygon points="26,4 12,26 22,26 20,44 36,20 26,20" fill="none" stroke="#2D6A4F" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="16" fill="none" stroke="#2D6A4F" stroke-width="2.8"/>
      <polyline points="24,12 24,24 32,28" fill="none" stroke="#2D6A4F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
<div class="page">
  <div class="grain"></div>
  <div class="dotgrid"></div>

  <!-- ============ CONTENT HTML ============ -->
  <div class="sketch-container">

    <!-- Title -->
    <div class="title-area">
      <div class="title-main">
        <span class="highlight-bg"></span>
        小米 MiMo V2.5 开放平台公测
      </div>
      <div class="title-sub">40天免费体验 · 全系小米AI大模型</div>
    </div>

    <div class="wavy-divider"></div>

    <!-- Main two-column layout -->
    <div class="main-layout">

      <!-- Left: Concept map -->
      <div class="left-col">
        <div class="concept-map">
          <!-- Node 1: 邀请码 -->
          <div class="concept-node" style="border-color:#C62828;">
            <svg class="node-icon" width="36" height="36"><use href="#icon-key"/></svg>
            <div class="node-label">邀请码</div>
            <div class="node-value red-accent">V4B9NJ</div>
            <div class="node-desc">填码即到账</div>
          </div>

          <!-- Node 2: API 体验金 -->
          <div class="concept-node">
            <svg class="node-icon" width="36" height="36"><use href="#icon-coin"/></svg>
            <div class="node-label">API 体验金</div>
            <div class="node-value">¥10</div>
            <div class="node-desc">邀请码兑换即得</div>
          </div>

          <!-- Node 3: Token -->
          <div class="concept-node">
            <svg class="node-icon" width="36" height="36"><use href="#icon-token"/></svg>
            <div class="node-label">免费 Token</div>
            <div class="node-value" style="font-size:30px;">100万亿</div>
            <div class="node-desc"><span class="marker-text">40天有效期</span></div>
          </div>

          <!-- Node 4: 模型系列 -->
          <div class="concept-node">
            <svg class="node-icon" width="36" height="36"><use href="#icon-brain"/></svg>
            <div class="node-label">全系模型</div>
            <div class="node-value" style="font-size:32px;">MiMo-V2.5</div>
            <div class="node-desc">小米AI全系大模型</div>
          </div>
        </div>

        <!-- SVG arrows row -->
        <div class="arrows-row">
          <svg width="100%" height="40" viewBox="0 0 780 40" preserveAspectRatio="xMidYMid meet">
            <!-- Arrow 1 -->
            <path d="M 140 20 C 170 10, 190 30, 210 20" stroke="#2D6A4F" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
            <!-- Arrow 2 -->
            <path d="M 340 20 C 370 10, 390 30, 410 20" stroke="#2D6A4F" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
            <!-- Arrow 3 -->
            <path d="M 540 20 C 570 10, 590 30, 610 20" stroke="#2D6A4F" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
          </svg>
        </div>

        <!-- Benefits row -->
        <div class="benefits-row">
          <div class="benefit-pill">
            <svg width="24" height="24"><use href="#icon-users"/></svg>
            <span class="benefit-text">名额仅 <strong>20</strong> 位</span>
          </div>
          <div class="benefit-pill">
            <svg width="24" height="24"><use href="#icon-zap"/></svg>
            <span class="benefit-text">先到先得</span>
          </div>
          <div class="benefit-pill">
            <svg width="24" height="24"><use href="#icon-clock"/></svg>
            <span class="benefit-text"><strong>40天</strong> 有效期</span>
          </div>
        </div>

        <!-- CTA -->
        <div class="cta-area">
          <div class="cta-url">platform.xiaomimimo.com</div>
          <div class="cta-note">注册 → 填码 V4B9NJ → ¥10 到账 → 开始体验</div>
        </div>
      </div>

      <!-- Right: Sticky note -->
      <div class="right-col">
        <div class="sticky-note">
          <div class="sticky-label">你的专属邀请码</div>
          <span class="sticky-code">V4B9NJ</span>
          <div class="sticky-hint">注册时填写 → 立获 ¥10</div>
          <!-- hand-drawn arrow pointing down -->
          <div class="sticky-arrow">
            <svg width="60" height="50" viewBox="0 0 60 50">
              <path d="M 30 5 C 30 5 28 25 28 35" stroke="#C62828" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M 22 30 L 30 40 L 38 30" stroke="#C62828" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="sticky-hint" style="font-size:16px; color:#C62828; font-weight:600;">仅20个名额，先到先得</div>
        </div>
      </div>

    </div>

  </div>
  <!-- ============ END CONTENT HTML ============ -->

  <div class="colophon">
    <div class="who">
      <img src="logo.png" alt="">
      <span>大强同学「www.dqtx.cc」</span>
    </div>
    <span class="info-source">小米 MiMo 官方</span>
  </div>
</div>
</body>
</html>
